# The west manifest file for embedded systems based on Zephyr.

manifest:
  version: "0.13"

  defaults:
    remote: zephyrproject

  # further "remotes"
  remotes:
    - name: zephyrproject
      url-base: https://github.com/zephyrproject-rtos
    - name: janchri
      url-base: https://github.com/janchri

  self:
    path: ws-zephyr

  projects:

  - name: zephyr
    path: zephyr
    remote: zephyrproject
    repo-path: zephyr
    revision: v4.5.0-rc2

    import:
      # Keep this list sorted alphabetically.
      name-allowlist:
        - cmsis_6
        - fatfs
        - hal_espressif
        - hal_st
        - hal_stm32
        - hal_nordic
        - hal_rpi_pico
        - littlefs
        - mbedtls
        - mcuboot
        - segger
        - tf-psa-crypto
        - zcbor

  - name: twixt
    remote: janchri
    revision: main
    path: modules/lib/twixt
