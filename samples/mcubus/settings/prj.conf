# The mcubus (CONFIG_MCUBUS) and the bus port come with the devicetree
CONFIG_I2C=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n

# The settings, served to the other MCU by name, in NVS on the simulated flash
# (storage_partition)
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MCUBUS_SETTINGS=y
CONFIG_MCUBUS_SETTINGS_VALUE_MAX=32
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_NVS_LOG_LEVEL_WRN=y
