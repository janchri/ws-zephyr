sample:
  name: Hello over the mcubus
common:
  platform_allow:
    - native_sim
  integration_platforms:
    - native_sim
  tags:
    - i2c
tests:
  # MCU a, started by twister; pytest/test_hello.py starts b next to it
  sample.mcubus.hello:
    extra_args: NODE=a
    harness: pytest
    required_applications:
      - name: sample.mcubus.hello.node_b
  sample.mcubus.hello.node_b:
    extra_args: NODE=b
    build_only: true
