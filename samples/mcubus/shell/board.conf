# The shell on the UART over the bus (board.overlay); the log stays on stdout
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_VT100_COLORS=n
# fs_dirent and the littlefs calls of the "fs" commands
CONFIG_SHELL_STACK_SIZE=4096

# The setting mcu/name, for the others; "mcubus get/set" in the shell. Settings
# are kept in NVS on the settings partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_MCUBUS_SETTINGS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# littlefs on the storage partition, mounted at /lfs (fstab in board.overlay);
# "fs" in the shell
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y
