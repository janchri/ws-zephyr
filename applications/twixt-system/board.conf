# Shell on the bus UART; the log stays on stdout, off the bus
CONFIG_SHELL=y
CONFIG_SHELL_LOG_BACKEND=n
CONFIG_SHELL_VT100_COLORS=n
# fs_dirent and the littlefs calls of the "fs" commands
CONFIG_SHELL_STACK_SIZE=4096

# The setting mcu/name, for the others; "twixt get/set" in the shell. Settings
# are kept in NVS on the settings partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_TWIXT_SETTINGS=y
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# littlefs on the storage partition, mounted at /lfs (fstab in board.overlay);
# "fs" in the shell
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_SHELL=y

# MCUmgr (SMP) on the shell, for the laptop: files on /lfs (fs group) and
# firmware images into slot 1 (img group)
CONFIG_MCUMGR=y
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_CRC=y
CONFIG_BASE64=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUMGR_GRP_IMG=y
