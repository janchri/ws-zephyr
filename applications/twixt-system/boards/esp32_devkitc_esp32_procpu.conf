# The esp32 i2c target backend (modules/lib/twixt drivers/i2c/esp32): one CPU, no power
# management, the byte target API
CONFIG_SMP=n
CONFIG_PM=n
CONFIG_I2C_TARGET_BUFFER_MODE=n

# The bus stack and ISR stack, larger than the nRF's
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=4096

# The log on the console UART, the shell on the bus
CONFIG_LOG_BACKEND_UART=y

