# The ports to the laptop: USB CDC-ACM, set up in src/main.c
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
# CDC-ACM logs every FIFO fill at INF
CONFIG_USBD_CDC_ACM_LOG_LEVEL_WRN=y

# The log on UART0 (GP0), next to MCUboot's
CONFIG_LOG_BACKEND_UART=y

CONFIG_I2C_MM_TARGET_REREGISTER=n
