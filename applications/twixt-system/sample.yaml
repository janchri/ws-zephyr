sample:
  name: twixt system
common:
  tags:
    - i2c
    - shell
tests:
  # The gateway, started by twister; pytest/test_system.py starts the
  # boards pico, nrf and esp32 next to it, from the builds below, on the same virtual bus
  app.twixt.system:
    platform_allow: native_sim
    integration_platforms:
      - native_sim
    extra_args: MCU=gw
    harness: pytest
    required_applications:
      - name: app.twixt.system.mcu_pico
      - name: app.twixt.system.mcu_nrf
      - name: app.twixt.system.mcu_esp32
  app.twixt.system.mcu_pico:
    platform_allow: native_sim
    extra_args: MCU=pico
    build_only: true
  app.twixt.system.mcu_nrf:
    platform_allow: native_sim
    extra_args: MCU=nrf
    build_only: true
  app.twixt.system.mcu_esp32:
    platform_allow: native_sim
    extra_args: MCU=esp32
    build_only: true
  app.twixt.system.pico_node:
    platform_allow: rpi_pico/rp2040/mcuboot
    extra_args: CONF_FILE=bd.conf
    build_only: true
  app.twixt.system.pico_gateway:
    platform_allow: rpi_pico/rp2040/mcuboot
    extra_args: CONF_FILE=gw.conf
    build_only: true
  app.twixt.system.nrf_node:
    platform_allow: nrf7002dk/nrf5340/cpuapp
    extra_args: CONF_FILE=bd.conf
    build_only: true
  app.twixt.system.nrf_ble_gateway:
    platform_allow: nrf7002dk/nrf5340/cpuapp
    sysbuild: true
    extra_args: twixt-system_CONF_FILE=gw.conf
    build_only: true
  app.twixt.system.esp_node:
    platform_allow: esp32_devkitc/esp32/procpu
    extra_args: CONF_FILE=bd.conf
    build_only: true
