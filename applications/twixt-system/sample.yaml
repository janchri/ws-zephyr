sample:
  name: twixt system
common:
  tags:
    - i2c
    - shell
tests:
  # The gateway, started by twister; pytest/test_system.py starts the
  # boards a, b and c next to it, from the builds below, on the same virtual bus
  app.twixt.system:
    platform_allow: native_sim
    integration_platforms:
      - native_sim
    extra_args: MCU=gw
    harness: pytest
    required_applications:
      - name: app.twixt.system.mcu_a
      - name: app.twixt.system.mcu_b
      - name: app.twixt.system.mcu_c
  app.twixt.system.mcu_a:
    platform_allow: native_sim
    extra_args: MCU=a
    build_only: true
  app.twixt.system.mcu_b:
    platform_allow: native_sim
    extra_args: MCU=b
    build_only: true
  app.twixt.system.mcu_c:
    platform_allow: native_sim
    extra_args: MCU=c
    build_only: true
  # The gateway on a Raspberry Pi Pico, on real I2C
  app.twixt.system.gateway_hw:
    platform_allow: rpi_pico
    integration_platforms:
      - rpi_pico
    extra_args: MCU=gw
    build_only: true
