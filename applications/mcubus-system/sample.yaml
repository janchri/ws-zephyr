sample:
  name: mcubus system
common:
  tags:
    - i2c
    - shell
tests:
  # The gateway, started by twister; pytest/test_system.py starts the
  # boards a, b and c next to it, from the builds below, on the same virtual bus
  app.mcubus.system:
    platform_allow: native_sim
    integration_platforms:
      - native_sim
    extra_args: NODE=gw
    harness: pytest
    required_applications:
      - name: app.mcubus.system.node_a
      - name: app.mcubus.system.node_b
      - name: app.mcubus.system.node_c
  app.mcubus.system.node_a:
    platform_allow: native_sim
    extra_args: NODE=a
    build_only: true
  app.mcubus.system.node_b:
    platform_allow: native_sim
    extra_args: NODE=b
    build_only: true
  app.mcubus.system.node_c:
    platform_allow: native_sim
    extra_args: NODE=c
    build_only: true
  # The gateway on a Raspberry Pi Pico, on real I2C
  app.mcubus.system.gateway_hw:
    platform_allow: rpi_pico
    integration_platforms:
      - rpi_pico
    extra_args: NODE=gw
    build_only: true
