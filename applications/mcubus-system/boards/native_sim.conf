# The MCUs are processes that meet in wall-clock time
CONFIG_NATIVE_SIM_SLOWDOWN_TO_REAL_TIME=y

# A byte on the emulated bus is 90 us; a 10 ms tick would round it up
CONFIG_SYS_CLOCK_TICKS_PER_SEC=100000

# The image runs from slot 0 (zephyr,code-partition), for the img group of MCUmgr
CONFIG_USE_DT_CODE_PARTITION=y
