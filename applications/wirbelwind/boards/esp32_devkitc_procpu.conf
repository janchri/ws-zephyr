# Ai-Thinker ESP32 Audio Kit (ESP32-A1S, AC101), see the .overlay

# SD card on the SDMMC host
CONFIG_SDHC=y
CONFIG_DISK_DRIVER_SDMMC=y

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2S=y
CONFIG_SPI=y
# The A1S module has 8 MB PSRAM (like the WROVER-E of the base board); the
# WiFi driver keeps its heap there, internal RAM is too small for everything
CONFIG_ESP_SPIRAM=y
CONFIG_ESP_WIFI_HEAP_SPIRAM=y

# WiFi hotspot "music.Box" with DHCP server (wifi.c)
CONFIG_WIFI=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_UDP=y
CONFIG_NET_DHCPV4_SERVER=y

# Short SD card hiccups must not stop the I2S stream
CONFIG_I2S_ESP32_ALLOWED_EMPTY_TX_QUEUE_DEFERRAL_TIME_MS=20
