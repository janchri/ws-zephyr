# The "SD card" is a FAT image on a second flash simulator instance
CONFIG_DISK_DRIVER_FLASH=y
# Format the image on first start if it does not contain a FAT yet
CONFIG_FS_FATFS_MKFS=y
CONFIG_FS_FATFS_MOUNT_MKFS=y

CONFIG_GPIO=y

# Logs go to the shell only (run with -uart_stdinout for an interactive terminal)
CONFIG_LOG_BACKEND_NATIVE_POSIX=n

# Network through the host's sockets: http://localhost:8080
CONFIG_ETH_NATIVE_TAP=n
CONFIG_NET_DRIVERS=y
CONFIG_NET_SOCKETS_OFFLOAD=y
CONFIG_NET_NATIVE_OFFLOADED_SOCKETS=y
CONFIG_WW_HTTP_PORT=8080
