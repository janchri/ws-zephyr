CONFIG_LOG=y
CONFIG_SHELL=y
# Logs go through the shell. Buffer the boot messages until the shell is up,
# otherwise they are lost
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=200
CONFIG_LOG_PROCESS_TRIGGER_THRESHOLD=1

# FPU is used by the MP3 decoder
CONFIG_FPU=y

# SD card with FAT, used by several threads (player, shell, web)
CONFIG_DISK_ACCESS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_FS_FATFS_CODEPAGE=850
CONFIG_FS_FATFS_NUM_FILES=6
CONFIG_FS_FATFS_NUM_DIRS=4

# Playlists are stored as JSON
CONFIG_JSON_LIBRARY=y

# Resume positions and volume live in internal flash
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_NVS=y
CONFIG_SETTINGS=y

# Button and volume potentiometer
CONFIG_INPUT=y
CONFIG_ADC=y

# Web interface (network: host sockets on native_sim, WiFi hotspot on the ESP32)
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_OPEN_MAX=24
CONFIG_ZVFS_POLL_MAX=16
CONFIG_HTTP_SERVER=y
CONFIG_HTTP_SERVER_VERSION_2=n
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=2048
CONFIG_HTTP_SERVER_STACK_SIZE=6144

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SHELL_STACK_SIZE=4096
