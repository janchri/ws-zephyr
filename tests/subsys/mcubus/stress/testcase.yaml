common:
  platform_allow:
    - native_sim
  integration_platforms:
    - native_sim
  tags:
    - i2c
    - settings
tests:
  # MCU a, started by twister; pytest/test_stress.py starts b and c next to
  # it, from the builds below, on the same virtual bus
  mcubus.stress:
    extra_args: NODE=a
    harness: pytest
    required_applications:
      - name: mcubus.stress.node_b
      - name: mcubus.stress.node_c
  mcubus.stress.node_b:
    extra_args: NODE=b
    build_only: true
  mcubus.stress.node_c:
    extra_args: NODE=c
    build_only: true
