description: |
  An MCU on the mcubus, a multi-master I2C bus of equal peers: a child of the
  bus node, reg is its I2C address. There it serves requests of the other MCUs
  (include/mcubus/mcubus.h).

  /chosen zephyr,mcubus-self is the MCU the firmware runs on.

    &i2c0 {
            mcu_a: mcu-a@10 {
                    compatible = "zephyr,mcubus-node";
                    reg = <0x10>;
            };
    };

    / {
            chosen {
                    zephyr,mcubus-self = &mcu_a;
            };
    };

compatible: "zephyr,mcubus-node"

include: i2c-device.yaml
