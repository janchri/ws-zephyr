description: |
  An MCU on the mcubus, at its I2C address. /chosen zephyr,mcubus-self is the
  MCU the image runs on. See include/mcubus/mcubus.h.

    &i2c0 {
            mcu_a: mcu-a@10 {
                    compatible = "zephyr,mcubus-node";
                    reg = <0x10>;
            };
    };

    / {
            chosen {
                    zephyr,mcubus-self = &mcu_a;
            };
    };

compatible: "zephyr,mcubus-node"

include: i2c-device.yaml
