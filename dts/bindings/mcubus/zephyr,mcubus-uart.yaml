description: |
  A UART over the mcubus: a byte stream to one other MCU, peer. Point
  zephyr,shell-uart or zephyr,console at it, or bridge it with
  zephyr,uart-bridge.

    bus_uart: bus-uart {
            compatible = "zephyr,mcubus-uart";
            peer = <&gw>;
    };

compatible: "zephyr,mcubus-uart"

include: base.yaml

properties:
  peer:
    type: phandle
    required: true
    description: zephyr,mcubus-node at the other end
